[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-cram"
version = "0.1.0"
description = "Classical energy reasoner: Hopfield-Tank-style constraint energies trained without BPTT, solved by relaxation, shipped with energy certificates (audit of arXiv:2611.17309)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SZL Holdings", email = "stephen@szlholdings.com" }]
keywords = ["energy-based-model", "reasoning", "hopfield", "constraint-satisfaction", "certificates", "sudoku"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Source = "https://github.com/szl-holdings/szl-cram"
Homepage = "https://github.com/szl-holdings/szl-cram"
Documentation = "https://github.com/szl-holdings/szl-cram/tree/main/docs"
"Bug Tracker" = "https://github.com/szl-holdings/szl-cram/issues"

[project.scripts]
szl-cram = "szl_cram.cli:main"

[tool.szl.release]
import_names = ["szl_cram"]

[tool.setuptools.packages.find]
where = ["src"]
