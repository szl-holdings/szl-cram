name: deploy cloudflare worker

# SZL estate pattern (a11oy alert-relay-worker): test first, deploy only from main,
# fail closed when the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are absent
# (repo secrets, or `cloudflare` environment secrets). Until the owner adds them the
# deploy job exits with a clear message and nothing is published. A deploy only counts
# once the readback proves the reported version serves 100% from this exact commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fail closed on missing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets."
            echo "::error::Owner step: add both repo-level secrets, then re-run this workflow."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install locked wrangler
        working-directory: worker
        run: npm ci
      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # wrangler-action exports CLOUDFLARE_ACCOUNT_ID from this input even when it is
          # empty, and wrangler then falls back to /memberships, which an account-scoped
          # token cannot read. Pass the account explicitly, as the a11oy workers do.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.jsonc --message ${{ github.sha }}
      - name: Read back deployed revision
        working-directory: worker
        # bash (not the default `bash -e`) enables pipefail, and wrangler needs the
        # credentials here because wrangler-action only sets them for its own step.
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          EXPECTED_MESSAGE: ${{ github.sha }}
        run: |
          set -euo pipefail
          version_id="$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -n 's/^Current Version ID: \([0-9a-f-]\{36\}\)$/\1/p' | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "::error::Deploy output did not report a Current Version ID."
            exit 1
          fi
          npx wrangler deployments status --config wrangler.jsonc --json > deployment.json
          npx wrangler versions view "$version_id" --config wrangler.jsonc --json > version.json
          python3 - "$version_id" "$EXPECTED_MESSAGE" <<'PY'
          import json, sys
          version_id, expected = sys.argv[1], sys.argv[2]
          deployment = json.load(open("deployment.json"))
          version = json.load(open("version.json"))
          traffic = [(v["version_id"], v["percentage"]) for v in deployment["versions"]]
          if traffic != [(version_id, 100)]:
              sys.exit(f"::error::Active deployment serves {traffic}, expected [({version_id!r}, 100)].")
          message = (version.get("annotations") or {}).get("workers/message")
          if version.get("id") != version_id or message != expected:
              sys.exit(f"::error::Version {version.get('id')!r} carries message {message!r}, expected {expected!r}.")
          print(f"Readback OK: version {version_id} serves 100% from commit {expected}.")
          PY
